[project]
name = "launchledger"
version = "0.1.0"
description = "An AI assistant over fake rocket-factory systems, with the reliability layer that keeps it trustworthy."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3,<4",
    "sqlalchemy>=2,<3",
    "alembic>=1,<2",
    "psycopg[binary]>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "python-multipart>=0.0.9",
]

[project.scripts]
ll = "launchledger.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launchledger"]

[tool.pytest.ini_options]
addopts = "--strict-markers -p no:cacheprovider"
markers = [
    "stage0", "stage1", "stage2", "stage3", "stage4",
    "stage5", "stage6", "stage7", "stage8",
    "smoke: real-model tests, manual only",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["launchledger/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["launchledger"]
exclude = ["launchledger/db/migrations/"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
